name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate release tag and versions
        run: node scripts/release-state.mjs --validate-version

      # npm 11 supports GitHub OIDC trusted publishing.
      - name: Upgrade npm
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Release checks
        run: npm run release:check

      - name: Install mcp-publisher
        run: |
          curl -fLsS "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Pack the verified build
        run: npm pack --ignore-scripts

      - name: Check for completed publication steps
        id: release
        run: node scripts/release-state.mjs >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.release.outputs.npm == 'true'
        run: npm publish "${{ steps.release.outputs.artifact }}" --provenance --access public

      # OIDC: the repository identity (Pixapi-AI/mcp) grants the
      # io.github.Pixapi-AI/* namespace without any stored token.
      - name: Authenticate to the official MCP Registry
        if: steps.release.outputs.registry == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        if: steps.release.outputs.registry == 'true'
        run: ./mcp-publisher publish
